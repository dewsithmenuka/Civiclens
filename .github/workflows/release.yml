name: Release
on:
  push:
    tags: ["v*.*.*"]
permissions: { contents: write }
jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - name: Build signed Android release for the hosted API
        working-directory: mobile
        env:
          MOBILE_API_BASE: ${{ vars.MOBILE_API_BASE }}
          PRIVACY_POLICY_URL: ${{ vars.PRIVACY_POLICY_URL }}
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          CIVICLENS_KEYSTORE_PATH: ${{ runner.temp }}/civiclens-upload-key.jks
          CIVICLENS_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          CIVICLENS_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          CIVICLENS_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          test -n "$MOBILE_API_BASE" || { echo "Set the MOBILE_API_BASE repository variable."; exit 1; }
          test -n "$PRIVACY_POLICY_URL" || { echo "Set the PRIVACY_POLICY_URL repository variable."; exit 1; }
          test -n "$ANDROID_KEYSTORE_BASE64" || { echo "Set the Android signing secrets before tagging a release."; exit 1; }
          printf '%s' "$ANDROID_KEYSTORE_BASE64" | base64 --decode > "$CIVICLENS_KEYSTORE_PATH"
          chmod 600 "$CIVICLENS_KEYSTORE_PATH"
          flutter pub get
          dart run tool/verify_release_config.dart "$MOBILE_API_BASE" "$PRIVACY_POLICY_URL"
          flutter test
          flutter build appbundle --release \
            --build-name="${GITHUB_REF_NAME#v}" \
            --build-number="$GITHUB_RUN_NUMBER" \
            --dart-define="API_BASE=$MOBILE_API_BASE" \
            --dart-define="PRIVACY_POLICY_URL=$PRIVACY_POLICY_URL"
      - uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          files: mobile/build/app/outputs/bundle/release/app-release.aab
